name: CI

# CI برای دو اپ مستقل: apps/api (Express + TypeScript) و apps/web (React + Vite + TypeScript).
# هر job فقط اسکریپت‌هایی را اجرا می‌کند که در package.json همان اپ تعریف شده‌اند
# (در حال حاضر هیچ اسکریپت lint/test ای وجود ندارد؛ type-check بخشی از build است).
# اگر manifest هر اپ موجود نباشد، مراحل آن job به‌جای شکست خوردن، رد (skip) می‌شوند.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: apps/api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip notice
        if: ${{ hashFiles('apps/api/package.json', 'apps/api/package-lock.json') == '' }}
        run: echo "apps/api manifest not found — skipping API checks."

      - name: Setup Node.js
        if: ${{ hashFiles('apps/api/package.json', 'apps/api/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        if: ${{ hashFiles('apps/api/package.json', 'apps/api/package-lock.json') != '' }}
        working-directory: apps/api
        run: npm ci

      # build = tsc -p tsconfig.json → هم type-check و هم تولید dist
      - name: Build
        if: ${{ hashFiles('apps/api/package.json', 'apps/api/package-lock.json') != '' }}
        working-directory: apps/api
        run: npm run build

  web:
    name: apps/web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip notice
        if: ${{ hashFiles('apps/web/package.json', 'apps/web/package-lock.json') == '' }}
        run: echo "apps/web manifest not found — skipping Web checks."

      - name: Setup Node.js
        if: ${{ hashFiles('apps/web/package.json', 'apps/web/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: ${{ hashFiles('apps/web/package.json', 'apps/web/package-lock.json') != '' }}
        working-directory: apps/web
        run: npm ci

      # build = tsc -b && vite build → type-check و باندل نهایی
      - name: Build
        if: ${{ hashFiles('apps/web/package.json', 'apps/web/package-lock.json') != '' }}
        working-directory: apps/web
        run: npm run build
