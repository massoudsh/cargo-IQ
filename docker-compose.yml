services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: cargoiq-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Empty keys = single shared development tenant. Set one key per tenant
      # before exposing this to anyone.
      CARGOIQ_API_KEYS: ${CARGOIQ_API_KEYS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cargoiq-api}
    # Not published to the host: only nginx reaches the API.
    expose:
      - "4000"
    # In-memory store: run exactly one replica (never `--scale api=2`).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: cargoiq-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CARGOIQ_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
